name: Deploy Mizan Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:cloudflare

  vercel-frontend:
    runs-on: ubuntu-latest
    needs: cloudflare-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
      - name: Create or reuse Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! pnpm dlx vercel@latest project inspect mizan-capital --scope mohamedabdelnabey88s-projects --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            pnpm dlx vercel@latest project add mizan-capital --scope mohamedabdelnabey88s-projects --token "$VERCEL_TOKEN"
          fi
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@latest deploy --prod --yes --scope mohamedabdelnabey88s-projects --project mizan-capital --token "$VERCEL_TOKEN"
