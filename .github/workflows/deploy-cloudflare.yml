name: Deploy Mizan-Capital Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Accounting tests
        run: pnpm test

      - name: Cloudflare worker tests
        run: pnpm test:cloudflare

      - name: Build Cloudflare Worker and assets
        run: pnpm build:cloudflare

      - name: Validate deployment bundle
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy Worker to Cloudflare
        run: pnpm exec wrangler deploy --config wrangler.jsonc
