name: Deploy Mizan Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-production.yml"
      - "cloudflare/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
      - name: Verify application types and finance tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Build Cloudflare assets
        run: pnpm build:cloudflare
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:cloudflare
      - name: Smoke test authentication database
        run: |
          set -e
          echo '--- auth health ---'
          curl --fail-with-body --silent --show-error https://mizan-capital.famaradona89.workers.dev/auth/health
          echo
